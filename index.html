<meta name="theme-color" content="#000c1a">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5fb;--card:#fff;--text:#1d2033;--muted:#6b7090;--key:#eceefa;--op:#dfe3ff;--acc:#4f46e5;--accT:#fff;--del:#fde4e4;--delT:#b3261e;--bd:#d9dcef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131f;--card:#1c1e30;--text:#eef0ff;--muted:#9a9fc4;--key:#2a2d45;--op:#35395c;--acc:#7c74ff;--accT:#10111c;--del:#4a2530;--delT:#ffb4ab;--bd:#34375a}}
:root[data-theme="dark"]{--bg:#12131f;--card:#1c1e30;--text:#eef0ff;--muted:#9a9fc4;--key:#2a2d45;--op:#35395c;--acc:#7c74ff;--accT:#10111c;--del:#4a2530;--delT:#ffb4ab;--bd:#34375a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;display:flex;justify-content:center;padding:12px}
.app{width:100%;max-width:440px}
h1{font-size:20px;margin:4px 0 10px;text-align:center}
h1 span{color:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--text);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.card{background:var(--card);border-radius:16px;padding:12px;border:1px solid var(--bd)}
.disp{min-height:92px;text-align:right;padding:6px 8px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#expr{font-size:22px;color:var(--muted);word-break:break-all;min-height:28px}
#res{font-size:34px;font-weight:600;word-break:break-all}
.bar{display:flex;gap:6px;margin:8px 0;font-size:13px;align-items:center;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--key);color:var(--text);font:inherit;font-size:13px}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{padding:12px 0;border:0;border-radius:12px;background:var(--key);color:var(--text);font:inherit;font-size:17px;cursor:pointer}
.grid button:active{filter:brightness(.9)}
.grid .f{background:var(--op);font-size:14px}
.grid .o{background:var(--op);color:var(--acc);font-weight:700}
.grid .d{background:var(--del);color:var(--delT)}
.grid .e{background:var(--acc);color:var(--accT);font-weight:700}
#hist{margin-top:10px;font-size:14px;max-height:150px;overflow:auto}
#hist div{padding:5px 0;border-bottom:1px dashed var(--bd);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#hist small{color:var(--muted)}
label{display:block;font-size:14px;margin:8px 0 4px;color:var(--muted)}
input[type=number]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--key);color:var(--text);font:inherit;font-size:16px}
.go{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--acc);color:var(--accT);font:inherit;font-size:16px}
#qout{margin-top:12px;line-height:1.8;font-size:16px}
.hide{display:none}
.hide{display:none!important}
.hd{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.hd img{width:52px;height:52px;border-radius:12px}
.hd div{flex:1;line-height:1.25}.hd b{font-size:17px;letter-spacing:.5px}.hd small{display:block;color:var(--muted)}
.tabs{overflow-x:auto;padding-bottom:4px}.tabs button{flex:none;padding:9px 12px;white-space:nowrap}
.in{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--key);color:var(--text);font:inherit;font-size:16px}
h3{margin:2px 0 4px;font-size:17px}
#out{margin-top:12px;line-height:1.9;font-size:16px;word-break:break-word}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal div{background:var(--card);padding:18px;border-radius:14px;max-width:340px;line-height:1.7}
.foot{text-align:center;margin:14px 0 4px;color:var(--muted);font-size:12px}.foot img{width:44px;border-radius:9px;display:block;margin:0 auto 4px}
</style>
</head>

var expr="",ans=0,isDeg=true,bn=false,hist=[];

var BN="০১২৩৪৫৬৭৮৯";
function show(s){s=String(s);return bn?s.replace(/[0-9]/g,function(d){return BN[d]}):s}
function fmt(x){if(!isFinite(x))return "ত্রুটি";var v=parseFloat(x.toPrecision(12));var s=String(v);if(Math.abs(v)>=1e15||(v!==0&&Math.abs(v)<1e-9))s=v.toExponential(6);return show(s)}
// keys: [label, insert, class]
var K=[
["sin","sin(","f"],["cos","cos(","f"],["tan","tan(","f"],["(","(","f"],[")",")","f"],

["log","log(","f"],["ln","ln(","f"],["√","√(","f"],["n!","!","f"],["π","π","f"],
["nPr","P(","f"],["nCr","C(","f"],[",",",","f"],["e","e","f"],["Ans","Ans","f"],
["7","7"],["8","8"],["9","9"],["DEL","DEL","d"],["AC","AC","d"],
["4","4"],["5","5"],["6","6"],["×","×","o"],["÷","÷","o"],
["1","1"],["2","2"],["3","3"],["+","+","o"],["−","-","o"],
["0","0"],[".","."],["%","%","o"],["1/x","1/(","f"],["=","=","e"]
];

function press(v){
 if(v==="AC"){expr="";$("res").textContent=show(0)}
 else if(v==="DEL"){expr=expr.replace(/(sin|cos|tan|asin|acos|atan|log|ln|Ans)\($|Ans$|.$/,"")}
 else if(v==="="){calc();return}
 else expr+=v;
 render();
}
function render(){$("expr").textContent=show(expr)}
// parser
function tokenize(s){
 var t=[],i=0,m;
 while(i<s.length){
  var c=s[i];
  if(c===" "){i++;continue}
  if((m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)))){t.push({n:parseFloat(m[1])});i+=m[1].length;continue}
  if((m=/^(asin|acos|atan|sin|cos|tan|log|ln|Ans)/.exec(s.slice(i)))){t.push({id:m[1]});i+=m[1].length;continue}
  if(c==="x"||c==="X"){t.push({id:"X"});i++;continue}
  if(c==="π"){t.push({n:Math.PI});i++;continue}
  if(c==="e"){t.push({n:Math.E});i++;continue}
  if(c==="√"){t.push({id:"sqrt"});i++;continue}
  if(c==="P"){t.push({id:"P"});i++;continue}
  if(c==="C"){t.push({id:"C"});i++;continue}
  if("+-×÷^!%(),".indexOf(c)>=0){t.push({op:c});i++;continue}
  throw 0;
 }
 return t;
}
function fact(n){if(n<0||n!==Math.floor(n)||n>170)throw 0;var r=1;for(var i=2;i<=n;i++)r*=i;return r}
function evalExpr(s){
 var t=tokenize(s),p=0;
 function peek(){return t[p]}
 function isOp(o){return t[p]&&t[p].op===o}
 function expr_(){var v=term();while(isOp("+")||isOp("-")){var o=t[p++].op;var r=term();v=o==="+"?v+r:v-r}return v}
 function term(){var v=unary();
  while(true){
   if(isOp("×")){p++;v*=unary()}
   else if(isOp("÷")){p++;var d=unary();if(d===0)throw 0;v/=d}
   else if(t[p]&&(t[p].n!==undefined||t[p].id||isOp("("))){v*=unary()}
   else break}
  return v}
 function unary(){if(isOp("-")){p++;return -unary()}if(isOp("+")){p++;return unary()}return pow()}
 function pow(){var b=post();if(isOp("^")){p++;return Math.pow(b,unary())}return b}
 function post(){var v=prim();while(isOp("!")||isOp("%")){var o=t[p++].op;v=o==="!"?fact(v):v/100}return v}
 function args(){if(!isOp("("))throw 0;p++;var a=[expr_()];while(isOp(",")){p++;a.push(expr_())}if(!isOp(")"))throw 0;p++;return a}
 function prim(){
  var k=t[p];if(!k)throw 0;
  if(k.n!==undefined){p++;return k.n}
  if(k.op==="("){p++;var v=expr_();if(isOp(")"))p++;return v}
  if(k.id){p++;
   if(k.id==="Ans")return ans;if(k.id==="X")return X;
   var a=args(),x=a[0],r=isDeg?Math.PI/180:1;
   switch(k.id){
    case"sin":x=Math.sin(x*r);if(isDeg&&Math.abs(a[0])%180===0)x=0;return x;
    case"cos":x=Math.cos(x*r);if(isDeg&&Math.abs(a[0]-90)%180===0)x=0;return x;
    case"tan":if(isDeg&&Math.abs(a[0]-90)%180===0)throw 0;return Math.tan(x*r);
    case"asin":return Math.asin(x)/r;case"acos":return Math.acos(x)/r;case"atan":return Math.atan(x)/r;
    case"log":if(x<=0)throw 0;return Math.log10(x);
    case"ln":if(x<=0)throw 0;return Math.log(x);
    case"sqrt":if(x<0)throw 0;return Math.sqrt(x);
    case"P":return fact(a[0])/fact(a[0]-a[1]);
    case"C":return fact(a[0])/(fact(a[1])*fact(a[0]-a[1]));
   }
  }
  throw 0;
 }
 var out=expr_();if(p<t.length)throw 0;return out;
}
function bal(s){var o=(s.match(/\(/g)||[]).length,c=(s.match(/\)/g)||[]).length;return s+Array(Math.max(0,o-c)+1).join(")")}
function calc(){
 if(!expr)return;
 try{
  var v=evalExpr(bal(expr));
  if(!isFinite(v)||isNaN(v))throw 0;
  v=parseFloat(v.toPrecision(12));
  hist.unshift({e:expr,r:v});if(hist.length>15)hist.pop();
  ans=v;$("res").textContent=fmt(v);expr=String(v);$("expr").textContent=show(hist[0].e+" =");renderHist();
 }catch(e){$("res").textContent="ত্রুটি";}
}
function renderHist(){
 var h=$("hist");h.innerHTML="";
 hist.forEach(function(x){var d=document.createElement("div");d.innerHTML="<small></small><b></b>";d.children[0].textContent=show(x.e);d.children[1].textContent=fmt(x.r);d.onclick=function(){expr=String(x.r);render()};h.appendChild(d)});
}
// live preview
var _render=render;
render=function(){_render();try{if(expr){var v=evalExpr(bal(expr));if(isFinite(v)&&!isNaN(v)){$("res").textContent=fmt(v);return}}}catch(e){}if(!expr)$("res").textContent=show(0)};
$("deg").onclick=function(){isDeg=true;$("deg").classList.add("on");$("rad").classList.remove("on");render()};
$("rad").onclick=function(){isDeg=false;$("rad").classList.add("on");$("deg").classList.remove("on");render()};
$("bn").onclick=function(){bn=!bn;$("bn").classList.toggle("on",bn);render();renderHist()};
document.addEventListener("keydown",function(e){

 if(/[0-9.+\-()^!%,]/.test(k)&&k.length===1)press(k);
 else if(k==="*")press("×");else if(k==="/"){e.preventDefault();press("÷")}
 else if(k==="Enter"||k==="="){e.preventDefault();calc()}
 else if(k==="Backspace")press("DEL");else if(k==="Escape")press("AC");
});
var X=0;
function N(s){s=String(s).trim();if(!s)throw 1;var v=evalExpr(bal(s));if(!isFinite(v)||isNaN(v))throw 1;return v}
function L(s){return String(s).split(/[\s,;]+/).filter(Boolean).map(N)}
function r(v){return show(parseFloat(v.toPrecision(10)))}
function R(v,p){return r(Math.round(v*p)/p)}
function F(f,x){X=x;return N(f)}
function MX(s){return String(s).split(/;|\n/).filter(function(x){return x.trim()}).map(L)}
